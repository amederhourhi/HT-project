# ---------------------------------------------------------
# Block 1: Build System Configuration
# What it does: Defines the build tool required to install CardioSense.
# How it does it: Uses standard setuptools as the build backend.
# ---------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------
# Block 2: Project Metadata
# What it does: Declares project name, version, and core info.
# How it does it: Uses standard PEP 621 metadata fields for pip.
# ---------------------------------------------------------
[project]
name = "cardiosense"
version = "0.1.0"
description = "Clinical Decision-Support System for Myocardial Infarction & Ischemia"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CardioSense Contributors" }
]

# ---------------------------------------------------------
# Block 3: Core Dependencies
# What it does: Declares the core libraries required to run the pipeline.
# How it does it: Lists working minimum versions for DSP, ML, and data.
# Note: Streamlit is omitted here as we are replacing it with FastAPI.
# ---------------------------------------------------------
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "wfdb>=4.1.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
]

# ---------------------------------------------------------
# Block 4: Development & Test Dependencies
# What it does: Declares extra tools needed only when running tests.
# How it does it: Installable via pip install -e ".[dev]"
# ---------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

# ---------------------------------------------------------
# Block 5: Package Discovery
# What it does: Tells setuptools which folders contain the package code.
# How it does it: Points directly to the 'src' package directory.
# ---------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]