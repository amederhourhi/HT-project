
name: CardioSense Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Deterministic regression tests
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Check out repository
      # --------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      # --------------------------------------------------
      # 4. Validate Python syntax
      # --------------------------------------------------
      - name: Check Python syntax
        run: python -m compileall -q src scripts

      # --------------------------------------------------
      # 5. Deterministic regression tests
      #
      # Includes:
      # - Engineering milestones 1-9
      # - Phase II development benchmarks
      # - Frozen paired R-peak evaluation protocol
      # - Independent runner authorization guardrails
      #
      # No raw ECG downloads, model training,
      # checkpoint changes, production promotion,
      # or reserved-cohort evaluation.
      # --------------------------------------------------
      - name: Run deterministic test suite
        run: |
          python -m pytest -q \
            tests/test_cohort_contract.py \
            tests/test_input_validation.py \
            tests/test_ecg_loader.py \
            tests/test_ecg_dataset_contract.py \
            tests/test_ensemble_input_contract.py \
            tests/test_api_input_contract.py \
            tests/test_triage_rules.py \
            tests/test_filters_unit.py \
            tests/test_feature_quality_contract.py \
            tests/test_feature_sqi_selection.py \
            tests/test_sqi_v3.py \
            tests/test_sqi_v3_separation.py \
            tests/test_sqi_artifact_validation.py \
            tests/test_sqi_clipping_regression.py \
            tests/test_inference_quality.py \
            tests/test_v3_quality_handoff.py \
            tests/test_model_contract_audit.py \
            tests/test_v3_feature_shift.py \
            tests/test_v3_rf_candidate.py \
            tests/test_v1_v3_rf_comparison.py \
            tests/test_sqi_rf_ablation.py \
            tests/test_sqi_ablation_uncertainty.py \
            tests/test_quality_handoff.py \
            tests/test_st_provenance.py \
            tests/test_legacy_quality_handoff.py \
            tests/test_report_validity.py \
            tests/test_report_st_availability.py \
            tests/test_report_measurement_parity.py \
            tests/test_st_measurement_view.py \
            tests/test_api_measurement_view.py \
            tests/test_v3_candidate_integrity.py \
            tests/test_v3_research_inference.py \
            tests/test_paired_fold9_audit.py \
            tests/test_validation_coverage.py \
            tests/test_ludb_qrs_accuracy.py \
            tests/test_m09_readiness.py \
            tests/test_ludb_rpeaks_phase2.py \
            tests/test_compare_rpeak_refinement.py \
            tests/test_rpeak_pairwise_protocol.py \
            tests/test_rpeak_independent_runner.py

      # --------------------------------------------------
      # 6. Audit saved LUDB expert-reference results
      # --------------------------------------------------
      - name: Audit saved QRS reference accuracy
        run: python -m scripts.audit_ludb_qrs_accuracy

      # --------------------------------------------------
      # 7. Audit previously identified QRS regressions
      # --------------------------------------------------
      - name: Audit boundary regressions and research readiness
        run: python -m scripts.audit_m09_readiness

      # --------------------------------------------------
      # 8. Preserve standalone clinical guardrails
      # --------------------------------------------------
      - name: Run standalone guardrail regression
        run: python tests/test_triage.py