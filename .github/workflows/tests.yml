# ---------------------------------------------------------
# Block 1: Workflow Triggers
# What it does: Runs tests automatically on pushes and pull requests.
# How it does it: Listens to push and pull_request events on all branches.
# ---------------------------------------------------------
name: tests

on:
  push:
  pull_request:

# ---------------------------------------------------------
# Block 2: Test Runner Environment Setup
# What it does: Spins up a clean Ubuntu runner with Python 3.11.
# How it does it: Uses standard GitHub checkout and setup-python actions.
# ---------------------------------------------------------
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # Block 3: Install Package & Dependencies
      # What it does: Installs the project in editable mode with test tools.
      # How it does it: Runs pip install -e .[dev] using pyproject.toml.
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ---------------------------------------------------------
      # Block 4: Run Complete Zero-Data Test Suite
      # What it does: Runs all unit and deterministic guardrail tests.
      # How it does it: Calls pytest on unit tests and executes test_triage.py.
      # ---------------------------------------------------------
      - name: Run unit and guardrail tests
        run: |
          pytest tests/test_triage_rules.py tests/test_filters_unit.py -v
          python tests/test_triage.py